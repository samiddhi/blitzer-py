[project]
name = "bltzr"
version = "0.2.2"
description = "Vocabulary extraction for language learners"
authors = [{name = "Samiddhi"}]
license = "CC-BY-SA-3.0"
readme = {file = "README.org", content-type = "text/plain"}
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "platformdirs>=4.5.1",
]

[project.scripts]
bltzr = "blitzer.cli:cli"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["blitzer*"]

[tool.setuptools.package-data]
blitzer = ["language-registry.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
